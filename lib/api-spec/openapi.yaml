openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Legacy authentication operations
  - name: parent
    description: Parent account, child, and support operations
  - name: clinic-link
    description: Parent and clinician linking operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/user:
    get:
      operationId: getAuthUser
      tags: [auth]
      summary: Get the current authenticated user
      responses:
        "200":
          description: Current user, or null when no user session is active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAuthUser"
  /parent/auth/register:
    post:
      operationId: registerParent
      tags: [parent]
      summary: Register a parent account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentRegistrationInput"
      responses:
        "201":
          description: Parent account registered and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentAuthResult"
  /parent/auth/login:
    post:
      operationId: loginParent
      tags: [parent]
      summary: Sign in to a parent account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentLoginInput"
      responses:
        "200":
          description: Parent signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentAuthResult"
  /parent/auth/logout:
    post:
      operationId: logoutParent
      tags: [parent]
      summary: Sign out and revoke the parent session
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      responses:
        "200":
          description: Parent session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
  /parent/session:
    get:
      operationId: getParentSession
      tags: [parent]
      summary: Get the signed-in parent and children
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      responses:
        "200":
          description: Current parent session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentSession"
  /parent/starter-library:
    get:
      operationId: getStarterLibrary
      tags: [parent]
      summary: List starter support templates
      responses:
        "200":
          description: Available starter templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StarterTemplate"
  /parent/children:
    post:
      operationId: createParentChild
      tags: [parent]
      summary: Create a child in the parent workspace
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentChildInput"
      responses:
        "201":
          description: Child created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentChild"
  /parent/children/{childId}:
    patch:
      operationId: updateParentChild
      tags: [parent]
      summary: Update a parent-owned child
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentChildUpdate"
      responses:
        "200":
          description: Child updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentChild"
  /parent/children/{childId}/goal-feedback:
    patch:
      operationId: recordParentGoalFeedback
      tags: [parent]
      summary: Record a caregiver's current rating of an active goal
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentGoalFeedbackInput"
      responses:
        "200":
          description: Updated behavior with the latest goal check-in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentBehavior"
  /parent/children/{childId}/dashboard:
    get:
      operationId: getParentDashboard
      tags: [parent]
      summary: Get a child's parent dashboard
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Child dashboard, including complete setup and support data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentDashboard"
  /parent/children/{childId}/daily-actions/{actionId}:
    patch:
      operationId: updateParentDailyAction
      tags: [parent]
      summary: Update a daily support action's status
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
        - name: actionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentDailyActionStatusInput"
      responses:
        "200":
          description: Updated daily support action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentDailyAction"
  /parent/children/{childId}/daily-actions/{actionId}/logs:
    post:
      operationId: logParentDailyAction
      tags: [parent]
      summary: Record how a daily support action went
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
        - name: actionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentDailyActionLogInput"
      responses:
        "201":
          description: Saved action feedback and updated action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentDailyActionLogResponse"
  /parent/children/{childId}/logs:
    post:
      operationId: addParentLog
      tags: [parent]
      summary: Add a parent behavior log
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentLogInput"
      responses:
        "201":
          description: Parent log created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentLog"
  /parent/children/{childId}/documents:
    get:
      operationId: listParentDocuments
      tags: [parent]
      summary: List a child's parent documents
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Parent documents for the child
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ParentDocument"
    post:
      operationId: uploadParentDocument
      tags: [parent]
      summary: Upload a private parent document for scanning
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ParentDocumentUploadInput"
      responses:
        "201":
          description: Parent document uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentDocument"
  /parent/documents/{documentId}/content:
    get:
      operationId: getParentDocumentContent
      tags: [parent]
      summary: Retrieve authorized document bytes
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Authorized document bytes; response is not cacheable
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /parent/children/{childId}/documents/{documentId}/scan:
    post:
      operationId: scanParentDocument
      tags: [parent]
      summary: Scan or retry scanning a parent document
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Scan completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentDocumentScanResult"
  /parent/children/{childId}/documents/{documentId}/sharing:
    patch:
      operationId: setParentDocumentSharing
      tags: [parent]
      summary: Set clinician sharing consent for a parent document
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentDocumentSharingInput"
      responses:
        "200":
          description: Document sharing consent updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentDocument"
  /parent/children/{childId}/chat:
    post:
      operationId: parentChat
      tags: [parent]
      summary: Ask a question using server-side parent support context
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentChatInput"
      responses:
        "200":
          description: Parent chat response with source references and disclaimer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentChatResult"
  /parent/clinic-invites:
    post:
      operationId: createParentClinicInvite
      tags: [clinic-link]
      summary: Create an email-bound parent clinic invitation
      security:
        - ClinicianSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentClinicInviteInput"
      responses:
        "201":
          description: Parent clinic invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentClinicInvite"
  /parent/children/{childId}/link-preview:
    post:
      operationId: previewParentClinicInvite
      tags: [clinic-link]
      summary: Preview a clinic invitation before connecting
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentClinicInviteTokenInput"
      responses:
        "200":
          description: Clinic invitation preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentClinicInvitePreview"
  /parent/children/{childId}/connect:
    post:
      operationId: connectParentClinic
      tags: [clinic-link]
      summary: Connect a parent child to a clinic
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentClinicConnectionInput"
      responses:
        "200":
          description: Parent child connected to the clinic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentClinicConnectionResult"
  /parent/children/{childId}/support-review:
    post:
      operationId: reviewParentSupport
      tags: [clinic-link]
      summary: Review shared parent support as a clinician
      security:
        - ClinicianSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentSupportReviewInput"
      responses:
        "200":
          description: Support review recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentSupportReviewResult"
  /parent/children/{childId}/shared-support:
    get:
      operationId: getParentSharedSupport
      tags: [clinic-link]
      summary: Preview shared parent support as a clinician
      security:
        - ClinicianBearer: []
        - ClinicianSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shared support and documents available for clinician review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentSharedSupport"
components:
  securitySchemes:
    ParentTokenHeader:
      type: apiKey
      in: header
      name: X-Parent-Token
    ParentBearer:
      type: http
      scheme: bearer
    ParentSessionCookie:
      type: apiKey
      in: cookie
      name: np_parent_sid
    ClinicianBearer:
      type: http
      scheme: bearer
    ClinicianSessionCookie:
      type: apiKey
      in: cookie
      name: sid
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: [string, "null"]
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        profileImageUrl:
          type: [string, "null"]
      required: [id, email, firstName, lastName, profileImageUrl]
    CurrentAuthUser:
      type: object
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
      required: [user]
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    OkResult:
      type: object
      properties:
        ok:
          type: boolean
          const: true
      required: [ok]
    Parent:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        email:
          type: string
        workspaceId:
          type: string
        accountType:
          type: string
          const: parent_free
      required: [id, firstName, email, workspaceId, accountType]
    ParentChild:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        age:
          type: [integer, "null"]
        notes:
          type: string
        behaviorKey:
          type: [string, "null"]
        behaviorName:
          type: [string, "null"]
        goal:
          type: [string, "null"]
        behaviors:
          type: array
          items:
            $ref: "#/components/schemas/ParentBehavior"
        workspaceId:
          type: string
        parentId:
          type: string
        familyId:
          type: string
        clinicianId:
          type: [string, "null"]
      required:
        - id
        - name
        - age
        - notes
        - behaviorKey
        - behaviorName
        - goal
        - behaviors
        - workspaceId
        - parentId
        - familyId
        - clinicianId
    ParentAuthResult:
      type: object
      properties:
        token:
          type: string
        parent:
          $ref: "#/components/schemas/Parent"
        children:
          type: array
          items:
            $ref: "#/components/schemas/ParentChild"
      required: [token, parent, children]
    ParentSession:
      type: object
      properties:
        parent:
          $ref: "#/components/schemas/Parent"
        children:
          type: array
          items:
            $ref: "#/components/schemas/ParentChild"
      required: [parent, children]
    ParentRegistrationInput:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
        confirmPassword:
          type: string
          minLength: 1
        privacyConsent:
          type: boolean
          const: true
        healthConsent:
          type: boolean
          const: true
      required:
        - firstName
        - email
        - password
        - confirmPassword
        - privacyConsent
        - healthConsent
    ParentLoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]
    ParentChildInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        age:
          type: integer
        notes:
          type: string
        behaviorKey:
          type: [string, "null"]
        customBehavior:
          type: [string, "null"]
        goal:
          type: [string, "null"]
        behaviors:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/ParentBehaviorInput"
      required: [name]
    ParentChildUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        age:
          type: integer
        notes:
          type: string
        behaviorKey:
          type: [string, "null"]
        customBehavior:
          type: [string, "null"]
        goal:
          type: [string, "null"]
        behaviors:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/ParentBehaviorInput"
    ParentGoalFeedbackInput:
      type: object
      properties:
        behaviorKey:
          type: string
          minLength: 1
          maxLength: 100
        customBehavior:
          type: [string, "null"]
          minLength: 1
          maxLength: 120
        goal:
          type: string
          minLength: 1
          maxLength: 500
        rating:
          type: string
          enum: [positive, needs_support]
      required: [behaviorKey, goal, rating]
    ParentBehavior:
      type: object
      properties:
        behaviorKey:
          type: string
          maxLength: 100
        customBehavior:
          type: [string, "null"]
        behaviorName:
          type: string
        goal:
          type: [string, "null"]
        goalRating:
          type: [string, "null"]
          enum: [positive, needs_support, null]
        goalRatingAt:
          type: [string, "null"]
          format: date-time
      required: [behaviorKey, customBehavior, behaviorName, goal]
    ParentBehaviorInput:
      type: object
      properties:
        behaviorKey:
          type: string
          maxLength: 100
        customBehavior:
          type: [string, "null"]
          maxLength: 120
        goal:
          type: [string, "null"]
          maxLength: 500
      required: [behaviorKey]
    StarterTemplate:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
        whatMayBeHappening:
          type: string
        rightNow:
          type: array
          items:
            type: string
        avoid:
          type: array
          items:
            type: string
        prevention:
          type: array
          items:
            type: string
        replacementSkill:
          type: string
        reinforcementIdea:
          type: string
        seekHelp:
          type: string
        track:
          type: array
          items:
            type: string
        relatedGoals:
          type: array
          items:
            type: string
      required:
        - key
        - name
        - description
        - whatMayBeHappening
        - rightNow
        - avoid
        - prevention
        - replacementSkill
        - reinforcementIdea
        - seekHelp
        - track
        - relatedGoals
    SourceReference:
      type: object
      properties:
        documentId:
          type: string
        title:
          type: string
        excerpt:
          type: [string, "null"]
      required: [documentId, title, excerpt]
    SupportCard:
      type: object
      properties:
        id:
          type: string
        behaviorKey:
          type: string
        behaviorName:
          type: string
        goal:
          type: [string, "null"]
        planGoal:
          type: [string, "null"]
          maxLength: 500
          description: Exact goal explicitly stated in a scanned source plan, independent of the selected goal.
        planGoalSourceDocumentIds:
          type: array
          items:
            type: string
        planGoalSourceReferences:
          type: array
          items:
            $ref: "#/components/schemas/SourceReference"
        source:
          type: string
          enum: [starter, parent_document, clinician_document, clinician_reviewed]
        sourceDocumentIds:
          type: array
          items:
            type: string
        sourceReferences:
          type: array
          items:
            $ref: "#/components/schemas/SourceReference"
        conflict:
          type: boolean
        conflictMessage:
          type: [string, "null"]
        whatMayBeHappening:
          type: string
        rightNow:
          type: array
          items:
            type: string
        avoid:
          type: array
          items:
            type: string
        prevention:
          type: array
          items:
            type: string
        replacementSkill:
          type: string
        reinforcementIdea:
          type: string
        seekHelp:
          type: string
        track:
          type: array
          items:
            type: string
        relatedGoals:
          type: array
          items:
            type: string
        dailyActivities:
          type: array
          description: Plan-grounded caregiver practice activities, with the source document and review status for each.
          items:
            type: object
            properties:
              title:
                type: string
              routineContext:
                type: string
              opportunity:
                type: string
              skill:
                type: string
              reinforcement:
                type: [string, "null"]
              sourceDocumentId:
                type: string
              sourceExcerpt:
                type: string
              sourceType:
                type: string
                enum: [clinician_reviewed, clinician_uploaded_plan, parent_uploaded_plan]
            required: [title, routineContext, opportunity, skill, reinforcement, sourceDocumentId, sourceExcerpt, sourceType]
        reviewedBy:
          type: [string, "null"]
        reviewedAt:
          type: [string, "null"]
      required:
        - id
        - behaviorKey
        - behaviorName
        - goal
        - source
        - planGoalSourceDocumentIds
        - planGoalSourceReferences
        - sourceDocumentIds
        - sourceReferences
        - conflict
        - conflictMessage
        - whatMayBeHappening
        - rightNow
        - avoid
        - prevention
        - replacementSkill
        - reinforcementIdea
        - seekHelp
        - track
        - relatedGoals
        - reviewedBy
        - reviewedAt
    ParentDocument:
      type: object
      properties:
        id:
          type: string
        childId:
          type: string
        title:
          type: string
        fileName:
          type: string
        documentType:
          type: string
        scanStatus:
          type: string
        scanError:
          type: [string, "null"]
        uploadedBy:
          type: string
          enum: [parent, clinician]
        shared:
          type: boolean
        reviewed:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - childId
        - title
        - fileName
        - documentType
        - scanStatus
        - scanError
        - uploadedBy
        - shared
        - reviewed
        - createdAt
    ParentLog:
      type: object
      properties:
        id:
          type: string
        childId:
          type: string
