openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Legacy authentication operations
  - name: parent
    description: Parent account, child, and support operations
  - name: clinic-link
    description: Parent and clinician linking operations
  - name: clinic-management
    description: Clinic-scoped staff access management
paths:
  /clinic-management/staff:
    get:
      operationId: listManagedClinicStaff
      tags: [clinic-management]
      summary: List staff in clinics administered by the signed-in clinician
      security:
        - ClinicianBearer: []
        - ClinicianSessionCookie: []
      responses:
        "200":
          description: Staff membership directory for the caller's active administrator memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedClinicStaffResponse"
        "401":
          description: Authentication required
        "500":
          description: Staff directory could not be loaded
  /clinic-management/{clinicId}/staff/{staffUserId}/revoke:
    parameters:
      - name: clinicId
        in: path
        required: true
        schema:
          type: string
      - name: staffUserId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: revokeClinicStaffAccess
      tags: [clinic-management]
      summary: Revoke a clinician's access within an administered clinic
      security:
        - ClinicianBearer: []
        - ClinicianSessionCookie: []
      responses:
        "200":
          description: Clinic-scoped staff access was revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicStaffRevocationResult"
        "401":
          description: Authentication required
        "403":
          description: Active clinic administrator permission required
        "404":
          description: Clinician membership not found
        "409":
          description: The final clinic administrator cannot be removed
        "500":
          description: Staff access could not be revoked
  /care-team/activity-library:
    get:
      operationId: getCareTeamActivityLibrary
      responses:
        "200":
          description: Existing versioned library
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CareActivity" } }
  /clinician/children/{childId}/goals-activities:
    parameters:
      - { name: childId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getClinicianGoalsActivities
      responses:
        "200":
          description: Authorized workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CareTeamWorkspace" }
  /clinician/children/{childId}/care-goals:
    parameters:
      - { name: childId, in: path, required: true, schema: { type: string } }
    post:
      operationId: createCareTeamGoal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CareGoalInput" }
      responses:
        "201":
          description: Goal saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CareGoal" }
  /clinician/children/{childId}/care-goals/{goalId}:
    parameters:
      - { name: childId, in: path, required: true, schema: { type: string } }
      - { name: goalId, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateCareTeamGoal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CareGoalInput" }
      responses:
        "200":
          description: Goal saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CareGoal" }
  /clinician/children/{childId}/assignments:
    parameters:
      - { name: childId, in: path, required: true, schema: { type: string } }
    post:
      operationId: createCareTeamAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CareAssignmentInput" }
      responses:
        "201":
          description: Assignment saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CareActivity" }
  /clinician/children/{childId}/assignments/{assignmentId}:
    parameters:
      - { name: childId, in: path, required: true, schema: { type: string } }
      - { name: assignmentId, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateCareTeamAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CareAssignmentInput" }
      responses:
        "200":
          description: Assignment saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CareActivity" }
  /clinician/children/{childId}/activity-recommendations/{recommendationId}/review:
    parameters:
      - { name: childId, in: path, required: true, schema: { type: string } }
      - { name: recommendationId, in: path, required: true, schema: { type: string } }
    post:
      operationId: reviewCareTeamActivityRecommendation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivityRecommendationReviewInput" }
      responses:
        "200":
          description: Existing review record returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CareActivity" }
        "201":
          description: Review action saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CareActivity" }
  /parent/children/{childId}/care-team:
    parameters:
      - { name: childId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getParentCareTeam
      responses:
        "200":
          description: Published assignments/goals and own practice history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CareTeamWorkspace" }
  /parent/children/{childId}/assignments/{assignmentId}/progress:
    parameters:
      - { name: childId, in: path, required: true, schema: { type: string } }
      - { name: assignmentId, in: path, required: true, schema: { type: string } }
    post:
      operationId: saveCareTeamPracticeProgress
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CarePracticeProgressInput" }
      responses:
        "200":
          description: Saved progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CareActivity" }
  /parent/children/{childId}/assignments/{assignmentId}/feedback:
    parameters:
      - { name: childId, in: path, required: true, schema: { type: string } }
      - { name: assignmentId, in: path, required: true, schema: { type: string } }
    post:
      operationId: recordCareTeamPractice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CarePracticeInput" }
      responses:
        "201":
          description: Descriptive feedback, never clinical mastery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CarePractice" }
  /parent/children/{childId}/goals:
    parameters:
      - { name: childId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getParentGoals
      tags: [parent]
      responses:
        "200":
          description: Authorized goals
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ParentGoal" } }
    post:
      operationId: createParentGoal
      tags: [parent]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParentGoalInput" }
      responses:
        "201":
          description: Parent goal created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentGoal" }
  /parent/children/{childId}/goals/{goalId}:
    parameters:
      - { name: childId, in: path, required: true, schema: { type: string } }
      - { name: goalId, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateParentGoal
      tags: [parent]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParentGoalUpdate" }
      responses:
        "200":
          description: Parent goal updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentGoal" }
    delete:
      operationId: deleteParentGoal
      tags: [parent]
      responses:
        "204": { description: Parent goal deleted }
  /parent/children/{childId}/messages:
    parameters:
      - { name: childId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getParentMessages
      tags: [parent]
      responses:
        "200":
          description: Care-team messages
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ParentMessage" } }
    post:
      operationId: sendParentMessage
      tags: [parent]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParentMessageInput" }
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentMessage" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/user:
    get:
      operationId: getAuthUser
      tags: [auth]
      summary: Get the current authenticated user
      responses:
        "200":
          description: Current user, or null when no user session is active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAuthUser"
  /parent/auth/register:
    post:
      operationId: registerParent
      tags: [parent]
      summary: Register a parent account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentRegistrationInput"
      responses:
        "201":
          description: Parent account registered and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentAuthResult"
  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Request a password reset link for a local parent or clinician account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequestInput"
      responses:
        "202":
          description: Request accepted without disclosing whether an account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetRequestResult"
        "400":
          description: Invalid request
        "429":
          description: Too many reset requests
  /auth/password-reset/complete:
    post:
      operationId: completePasswordReset
      tags: [auth]
      summary: Set a new password using a one-time reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetCompleteInput"
      responses:
        "200":
          description: Password changed and existing sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "400":
          description: Invalid or expired reset token, or invalid password
        "429":
          description: Too many reset attempts
  /parent/auth/login:
    post:
      operationId: loginParent
      tags: [parent]
      summary: Sign in to a parent account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentLoginInput"
      responses:
        "200":
          description: Parent signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentAuthResult"
  /parent/auth/change-password:
    post:
      operationId: changeParentPassword
      tags: [parent]
      summary: Change the signed-in parent's password
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentPasswordChangeInput"
      responses:
        "200":
          description: Parent password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "400":
          description: Invalid input or incorrect current password
        "401":
          description: Parent session is not valid
        "429":
          description: Too many password change attempts
  /parent/auth/logout:
    post:
      operationId: logoutParent
      tags: [parent]
      summary: Sign out and revoke the parent session
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      responses:
        "200":
          description: Parent session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
  /parent/session:
    get:
      operationId: getParentSession
      tags: [parent]
      summary: Get the signed-in parent and children
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      responses:
        "200":
          description: Current parent session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentSession"
  /parent/starter-library:
    get:
      operationId: getStarterLibrary
      tags: [parent]
      summary: List starter support templates
      responses:
        "200":
          description: Available starter templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StarterTemplate"
  /parent/children:
    post:
      operationId: createParentChild
      tags: [parent]
      summary: Create a child in the parent workspace
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentChildInput"
      responses:
        "201":
          description: Child created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentChild"
  /parent/children/{childId}:
    patch:
      operationId: updateParentChild
      tags: [parent]
      summary: Update a parent-owned child
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentChildUpdate"
      responses:
        "200":
          description: Child updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentChild"
  /parent/children/{childId}/goal-feedback:
    patch:
      operationId: recordParentGoalFeedback
      tags: [parent]
      summary: Record a caregiver's current rating of an active goal
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentGoalFeedbackInput"
      responses:
        "200":
          description: Updated behavior with the latest goal check-in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentBehavior"
  /parent/children/{childId}/dashboard:
    get:
      operationId: getParentDashboard
      tags: [parent]
      summary: Get a child's parent dashboard
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Child dashboard, including complete setup and support data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentDashboard"
  /parent/children/{childId}/document-support-cards/{cardId}:
    patch:
      operationId: updateParentDocumentSupportCard
      tags: [parent]
      summary: Correct or dismiss a document-informed support suggestion
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
        - name: cardId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentDocumentSupportCardUpdate"
      responses:
        "200":
          description: Updated parent correction for the source-linked suggestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentDocumentSupportCardUpdateResult"
  /parent/children/{childId}/daily-actions/{actionId}:
    patch:
      operationId: updateParentDailyAction
      tags: [parent]
      summary: Update a daily support action's status
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
        - name: actionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentDailyActionStatusInput"
      responses:
        "200":
          description: Updated daily support action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentDailyAction"
  /parent/children/{childId}/daily-actions/{actionId}/logs:
    post:
      operationId: logParentDailyAction
      tags: [parent]
      summary: Record how a daily support action went
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
        - name: actionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentDailyActionLogInput"
      responses:
        "201":
          description: Saved action feedback and updated action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentDailyActionLogResponse"
  /parent/children/{childId}/daily-actions/{actionId}/practice-progress:
    patch:
      operationId: updateParentPracticeProgress
      tags: [parent]
      summary: Save a parent's activity position and saved-for-later choice
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
        - name: actionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentPracticeProgressInput"
      responses:
        "200":
          description: Saved child-specific activity progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentPracticeProgress"
  /parent/children/{childId}/family-tools:
    get:
      operationId: getParentFamilyTools
      tags: [parent]
      summary: Read the parent's private routines, preferences, and reminder schedules
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Child-specific family tools
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentFamilyTools"
    put:
      operationId: saveParentFamilyTools
      tags: [parent]
      summary: Save private routines, preferences, and reminder schedules
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentFamilyToolsInput"
      responses:
        "200":
          description: Saved child-specific family tools
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentFamilyTools"
  /parent/children/{childId}/logs:
    post:
      operationId: addParentLog
      tags: [parent]
      summary: Add a parent behavior log
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentLogInput"
      responses:
        "201":
          description: Parent log created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentLog"
  /clinician/children/{childId}/observations/{logId}/feedback:
    post:
      operationId: recordClinicianObservationFeedback
      tags: [clinic-link]
      summary: Save feedback on a parent observation the family shared
      security:
        - ClinicianBearer: []
        - ClinicianSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
        - name: logId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClinicianObservationFeedbackInput"
      responses:
        "200":
          description: Feedback saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  clinicianFeedback: { type: string }
                  clinicianFeedbackAt: { type: string }
                required: [ok, clinicianFeedback, clinicianFeedbackAt]
  /parent/children/{childId}/documents:
    get:
      operationId: listParentDocuments
      tags: [parent]
      summary: List a child's parent documents
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Parent documents for the child
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ParentDocument"
    post:
      operationId: uploadParentDocument
      tags: [parent]
      summary: Upload a private parent document for scanning
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ParentDocumentUploadInput"
      responses:
        "201":
          description: Parent document uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentDocument"
  /parent/documents/{documentId}/content:
    get:
      operationId: getParentDocumentContent
      tags: [parent]
      summary: Retrieve authorized document bytes
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Authorized document bytes; response is not cacheable
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /parent/children/{childId}/documents/{documentId}/scan:
    post:
      operationId: scanParentDocument
      tags: [parent]
      summary: Scan or retry scanning a parent document
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Scan completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentDocumentScanResult"
  /parent/children/{childId}/documents/{documentId}/sharing:
    patch:
      operationId: setParentDocumentSharing
      tags: [parent]
      summary: Set clinician sharing consent for a parent document
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentDocumentSharingInput"
      responses:
        "200":
          description: Document sharing consent updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentDocument"
  /parent/children/{childId}/chat:
    post:
      operationId: parentChat
      tags: [parent]
      summary: Ask a question using server-side parent support context
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentChatInput"
      responses:
        "200":
          description: Parent chat response with source references and disclaimer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentChatResult"
  /parent/clinic-invites:
    post:
      operationId: createParentClinicInvite
      tags: [clinic-link]
      summary: Create an email-bound parent clinic invitation
      security:
        - ClinicianSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentClinicInviteInput"
      responses:
        "201":
          description: Parent clinic invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentClinicInvite"
  /parent/children/{childId}/link-preview:
    post:
      operationId: previewParentClinicInvite
      tags: [clinic-link]
      summary: Preview a clinic invitation before connecting
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentClinicInviteTokenInput"
      responses:
        "200":
          description: Clinic invitation preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentClinicInvitePreview"
  /parent/children/{childId}/connect:
    post:
      operationId: connectParentClinic
      tags: [clinic-link]
      summary: Connect a parent child to a clinic
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentClinicConnectionInput"
      responses:
        "200":
          description: Parent child connected to the clinic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentClinicConnectionResult"
  /parent/children/{childId}/clinic-link:
    delete:
      operationId: revokeParentClinicLink
      tags: [clinic-link]
      summary: Disconnect a child from a clinic without deleting parent records
      security:
        - ParentTokenHeader: []
        - ParentBearer: []
        - ParentSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Clinic access disconnected
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
                required: [ok, message]
  /parent/children/{childId}/support-review:
    post:
      operationId: reviewParentSupport
      tags: [clinic-link]
      summary: Review shared parent support as a clinician
      security:
        - ClinicianSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentSupportReviewInput"
      responses:
        "200":
          description: Support review recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentSupportReviewResult"
  /parent/children/{childId}/shared-support:
    get:
      operationId: getParentSharedSupport
      tags: [clinic-link]
      summary: Preview shared parent support as a clinician
      security:
        - ClinicianBearer: []
        - ClinicianSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shared support and documents available for clinician review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentSharedSupport"
  /parent/children/{childId}/shared-support/{cardId}/activities/{activityIndex}:
    post:
      operationId: updateSharedSupportActivityVersion
      tags: [clinic-link]
      summary: Review or assign an exact version of a shared support activity
      security:
        - ClinicianBearer: []
        - ClinicianSessionCookie: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
        - name: cardId
          in: path
          required: true
          schema:
            type: string
        - name: activityIndex
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClinicianActivityActionInput"
      responses:
        "200":
          description: Updated shared support with current activity review status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentSharedSupport"
components:
  securitySchemes:
    ParentTokenHeader:
      type: apiKey
      in: header
      name: X-Parent-Token
    ParentBearer:
      type: http
      scheme: bearer
    ParentSessionCookie:
      type: apiKey
      in: cookie
      name: np_parent_sid
    ClinicianBearer:
      type: http
      scheme: bearer
    ClinicianSessionCookie:
      type: apiKey
      in: cookie
      name: sid
  schemas:
    CareStatus:
      type: string
      enum: [draft, published, paused, archived]
    ActivityStatus:
      type: string
      enum: [draft, needs_review, needs_details, approved, published, paused, archived, rejected, superseded]
    CareGoalInput:
      type: object
      required: [title, description]
      properties:
        title: { type: string, minLength: 1, maxLength: 180 }
        description: { type: string, minLength: 1, maxLength: 4000 }
        skill: { type: string, maxLength: 120 }
        measurement: { type: string, enum: [frequency, duration, percentage, completed_steps, clinician_defined, observation] }
        target: { type: [number, "null"], minimum: 0 }
        milestones: { type: array, maxItems: 30, items: { type: string, maxLength: 300 } }
        notes: { type: string, maxLength: 4000 }
        status: { $ref: "#/components/schemas/CareStatus" }
        expectedVersion: { type: integer, minimum: 0 }
    CareGoal:
      allOf:
        - { $ref: "#/components/schemas/CareGoalInput" }
        - type: object
          required: [id, childId, version, status]
          properties:
            id: { type: string }
            childId: { type: string }
            version: { type: integer }
            source: { type: string }
            canEdit: { type: boolean }
            progress: { type: [number, "null"] }
            linkedActivityIds: { type: array, items: { type: string } }
    CareAssignmentInput:
      type: object
      properties:
        libraryId: { type: [string, "null"] }
        goalId: { type: [string, "null"] }
        title: { type: string, maxLength: 180 }
        description: { type: string, maxLength: 2000 }
        skill: { type: string, maxLength: 120 }
        estimatedMinutes: { type: [integer, "null"], minimum: 1, maximum: 180 }
        materials: { type: string, maxLength: 2000 }
        steps: { type: array, maxItems: 40, items: { type: string, minLength: 1, maxLength: 2000 } }
        whyItMayHelp: { type: string, maxLength: 2000 }
        ifDifficult: { type: string, maxLength: 2000 }
        notes: { type: string, maxLength: 4000 }
        schedule: { type: string, maxLength: 300 }
        status: { $ref: "#/components/schemas/ActivityStatus" }
        expectedVersion: { type: integer, minimum: 0 }
        planConfirmed: { type: boolean }
        reviewNote: { type: string, maxLength: 2000 }
    ActivityRecommendationReviewInput:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [start_review, approve, reject, request_details] }
        fitSafetyConfirmed: { type: boolean }
        reviewNote: { type: string, maxLength: 2000 }
    CareActivityEvidenceReference:
      type: object
      required: [key, title, url, publishedYear, evidenceType, designImplication, limitation]
      properties:
        key: { type: string }
        title: { type: string }
        url: { type: string, format: uri }
        publishedYear: { type: integer }
        evidenceType: { type: string }
        designImplication: { type: string }
        limitation: { type: string }
    CareActivity:
      type: object
      required: [id, childId, title, description, skill, steps, status, version, source]
      properties:
        id: { type: string }
        childId: { type: string }
        libraryId: { type: [string, "null"] }
        goalId: { type: [string, "null"] }
        goalTitle: { type: [string, "null"] }
        title: { type: string }
        description: { type: string }
        skill: { type: string }
        estimatedMinutes: { type: [integer, "null"] }
        materials: { type: string }
        steps: { type: array, items: { type: string } }
        whyItMayHelp: { type: string }
        ifDifficult: { type: string }
        notes: { type: string }
        schedule: { type: string }
        status: { $ref: "#/components/schemas/ActivityStatus" }
        version: { type: integer }
        source: { type: string }
        currentStep: { type: integer }
        bookmarked: { type: boolean }
        skillDomain:
          type: string
          enum: [communication, transitions, daily_living, social_play, coping, parent_preparation]
        appropriateContexts: { type: array, items: { type: string } }
        requiredInformation: { type: array, items: { type: string } }
        caregiverPhrases: { type: array, items: { type: string } }
        stopConditions: { type: array, items: { type: string } }
        riskTier:
          type: string
          enum: [low, context_sensitive, requires_authorized_plan]
        evidenceReferences:
          type: array
          items: { $ref: "#/components/schemas/CareActivityEvidenceReference" }
        exclusionCriteria: { type: array, items: { type: string } }
        sourceClassification:
          type: string
          enum: [general_starter, document_candidate, clinician_reviewed_document, research_informed_general_starter]
        personalizationFields: { type: array, items: { type: string } }
        requiresClinicianConfirmation: { type: boolean }
        planConfirmed: { type: boolean }
        recommendationId: { type: [string, "null"] }
        reviewContext: { type: string }
        reviewStartAction: { type: string }
        reviewEnding: { type: string }
        reviewPauseConditions: { type: array, items: { type: string } }
        sourceEvidence:
          type: array
          items: { $ref: "#/components/schemas/ActivityRecommendationEvidence" }
        matchReasons: { type: array, items: { type: string } }
        reviewNote: { type: [string, "null"] }
        reviewedBy: { type: [string, "null"] }
        reviewedAt: { type: [string, "null"], format: date-time }
        riskClassification: { type: string }
        missingInformation: { type: array, items: { type: string } }
        relatedGoal: { type: [string, "null"] }
    CarePracticeProgressInput:
      type: object
      required: [version, currentStep, bookmarked]
      properties:
        version: { type: integer, minimum: 1 }
        currentStep: { type: integer, minimum: 0, maximum: 40 }
        bookmarked: { type: boolean }
    CarePracticeInput:
      type: object
      required: [version, outcome, requestId]
      properties:
        version: { type: integer, minimum: 1 }
        outcome: { type: string, enum: [tried, needed_support, not_tried] }
        note: { type: string, maxLength: 4000 }
        requestId: { type: string, minLength: 8, maxLength: 100 }
    CarePractice:
      type: object
      required: [id, assignmentId, childId, version, outcome, createdAt, title]
      properties:
        id: { type: string }
        assignmentId: { type: string }
        childId: { type: string }
        version: { type: integer }
        outcome: { type: string }
        note: { type: [string, "null"] }
        title: { type: string }
        goalId: { type: [string, "null"] }
        goalTitle: { type: [string, "null"] }
        createdAt: { type: string }
        steps: { type: array, items: { type: string } }
    CareObservation:
      type: object
      required: [id, createdAt]
      properties:
        id: { type: string }
        createdAt: { type: string }
        behavior: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        intensity: { type: [string, "null"] }
    ActivityRecommendationEvidence:
      type: object
      required: [recordId, category, documentId, documentTitle, sourceExcerpt, reviewStatus]
      properties:
        recordId: { type: string }
        category: { type: string }
        documentId: { type: string }
        documentTitle: { type: string }
        sourceSection: { type: [string, "null"] }
        sourcePage: { type: [integer, "null"] }
        sourceExcerpt: { type: string }
        reviewStatus: { type: string }
    ActivityRecommendation:
      type: object
      required: [id, priorityTier, status, title, description, skill, estimatedMinutes, materials, startAction, steps, ending, pauseConditions, matchReasons, evidence, sourceClassification, researchReferences, safetyReviewRequired]
      properties:
        id: { type: string }
        priorityTier:
          type: string
          enum: [clinician_approved_document_activity, document_activity_candidate, document_grounded_library]
        status:
          type: string
          enum: [approved_not_assigned, needs_details, needs_clinician_review, suggestion_only]
        missingInformation: { type: array, items: { type: string } }
        relatedGoal: { type: [string, "null"] }
        riskClassification: { type: string }
        routineContext: { type: string }
        title: { type: string }
        description: { type: string }
        skill: { type: string }
        skillDomain:
          type: string
          enum: [communication, transitions, daily_living, social_play, coping, parent_preparation]
        estimatedMinutes: { type: [integer, "null"] }
        materials: { type: array, items: { type: string } }
        startAction: { type: string }
        steps: { type: array, items: { type: string } }
        ending: { type: string }
        pauseConditions: { type: array, items: { type: string } }
        matchReasons: { type: array, items: { type: string } }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/ActivityRecommendationEvidence" }
        sourceClassification:
          type: string
          enum: [document_candidate, clinician_reviewed_document, research_informed_general_starter]
        researchReferences:
          type: array
          items: { $ref: "#/components/schemas/CareActivityEvidenceReference" }
        safetyReviewRequired: { type: boolean }
    CareTeamWorkspace:
      type: object
      required: [goals, assignments, recentPractice, observations]
      properties:
        goals: { type: array, items: { $ref: "#/components/schemas/CareGoal" } }
        assignments: { type: array, items: { $ref: "#/components/schemas/CareActivity" } }
        recentPractice: { type: array, items: { $ref: "#/components/schemas/CarePractice" } }
        observations: { type: array, items: { $ref: "#/components/schemas/CareObservation" } }
        activityRecommendations:
          type: array
          items: { $ref: "#/components/schemas/ActivityRecommendation" }
        activityReviews:
          type: array
          items: { $ref: "#/components/schemas/CareActivity" }
        activityRecommendationStatus:
          type: string
          enum: [ready, scan_incomplete, no_verified_matches, no_documents]
        activityRecommendationMessage: { type: string }
        activitySafetyEvidence:
          type: array
          items: { $ref: "#/components/schemas/ActivityRecommendationEvidence" }
    ParentGoal:
      type: object
      properties:
        id: { type: string }
        childId: { type: string }
        title: { type: string }
        description: { type: string }
        progress: { type: integer }
        target: { type: integer }
        source: { type: string }
        createdByClinician: { type: boolean }
        canEdit: { type: boolean }
        canDelete: { type: boolean }
      required: [id, childId, title, description, progress, target, source, createdByClinician, canEdit, canDelete]
    ParentGoalInput:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 180 }
        description: { type: string, maxLength: 3000 }
        target: { type: integer, minimum: 1, maximum: 10000 }
      required: [title]
    ParentGoalUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 180 }
        description: { type: string, maxLength: 3000 }
        progress: { type: integer, minimum: 0, maximum: 10000 }
        target: { type: integer, minimum: 1, maximum: 10000 }
    ParentMessageInput:
      type: object
      properties:
        content: { type: string, minLength: 1, maxLength: 5000 }
      required: [content]
    ParentMessage:
      type: object
      properties:
        id: { type: string }
        childId: { type: string }
        content: { type: string }
        senderRole: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, childId, content, senderRole, createdAt]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: [string, "null"]
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        profileImageUrl:
          type: [string, "null"]
      required: [id, email, firstName, lastName, profileImageUrl]
    CurrentAuthUser:
      type: object
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
      required: [user]
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    OkResult:
      type: object
      properties:
        ok:
          type: boolean
          const: true
      required: [ok]
    Parent:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        email:
          type: string
        workspaceId:
          type: string
        accountType:
          type: string
          enum: [parent_free, legacy_family]
      required: [id, firstName, email, workspaceId, accountType]
    ParentChild:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        age:
          type: [integer, "null"]
        notes:
          type: string
        behaviorKey:
          type: [string, "null"]
        behaviorName:
          type: [string, "null"]
        goal:
          type: [string, "null"]
        behaviors:
          type: array
          items:
            $ref: "#/components/schemas/ParentBehavior"
        workspaceId:
          type: string
        parentId:
          type: string
        familyId:
          type: string
        clinicianId:
          type: [string, "null"]
      required:
        - id
        - name
        - age
        - notes
        - behaviorKey
        - behaviorName
        - goal
        - behaviors
        - workspaceId
        - parentId
        - familyId
        - clinicianId
    ParentAuthResult:
      type: object
      properties:
        token:
          type: string
        parent:
          $ref: "#/components/schemas/Parent"
        children:
          type: array
          items:
            $ref: "#/components/schemas/ParentChild"
      required: [token, parent, children]
    ParentSession:
      type: object
      properties:
        parent:
          $ref: "#/components/schemas/Parent"
        children:
          type: array
          items:
            $ref: "#/components/schemas/ParentChild"
      required: [parent, children]
    ParentRegistrationInput:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
        confirmPassword:
          type: string
          minLength: 1
        privacyConsent:
          type: boolean
          const: true
        healthConsent:
          type: boolean
          const: true
      required:
        - firstName
        - email
        - password
        - confirmPassword
        - privacyConsent
        - healthConsent
    ParentLoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]
    ParentChildInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        age:
          type: integer
        notes:
          type: string
        behaviorKey:
          type: [string, "null"]
        customBehavior:
          type: [string, "null"]
        goal:
          type: [string, "null"]
        behaviors:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/ParentBehaviorInput"
      required: [name]
    ParentChildUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        age:
          type: integer
        notes:
          type: string
        behaviorKey:
          type: [string, "null"]
        customBehavior:
          type: [string, "null"]
        goal:
          type: [string, "null"]
        behaviors:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/ParentBehaviorInput"
    ParentGoalFeedbackInput:
      type: object
      properties:
        behaviorKey:
          type: string
          minLength: 1
          maxLength: 100
        customBehavior:
          type: [string, "null"]
          minLength: 1
          maxLength: 120
        goal:
          type: string
          minLength: 1
          maxLength: 500
        rating:
          type: string
          enum: [positive, needs_support]
      required: [behaviorKey, goal, rating]
    ParentBehavior:
      type: object
      properties:
        behaviorKey:
          type: string
          maxLength: 100
        customBehavior:
          type: [string, "null"]
        behaviorName:
          type: string
        goal:
          type: [string, "null"]
        goalRating:
          type: [string, "null"]
          enum: [positive, needs_support, null]
        goalRatingAt:
          type: [string, "null"]
          format: date-time
      required: [behaviorKey, customBehavior, behaviorName, goal]
    ParentBehaviorInput:
      type: object
      properties:
        behaviorKey:
          type: string
          maxLength: 100
        customBehavior:
          type: [string, "null"]
          maxLength: 120
        goal:
          type: [string, "null"]
          maxLength: 500
      required: [behaviorKey]
    StarterTemplate:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
        whatMayBeHappening:
          type: string
        rightNow:
          type: array
          items:
            type: string
        avoid:
          type: array
          items:
            type: string
        prevention:
          type: array
          items:
            type: string
        replacementSkill:
          type: string
        reinforcementIdea:
          type: string
        seekHelp:
          type: string
        track:
          type: array
          items:
            type: string
        relatedGoals:
          type: array
          items:
            type: string
      required:
        - key
        - name
        - description
        - whatMayBeHappening
        - rightNow
        - avoid
        - prevention
        - replacementSkill
        - reinforcementIdea
        - seekHelp
        - track
        - relatedGoals
    SourceReference:
      type: object
      properties:
        documentId:
          type: string
        title:
          type: string
        excerpt:
          type: [string, "null"]
      required: [documentId, title, excerpt]
    SupportCard:
      type: object
      properties:
        id:
          type: string
        behaviorKey:
          type: string
        behaviorName:
          type: string
        goal:
          type: [string, "null"]
        planGoal:
          type: [string, "null"]
          maxLength: 500
          description: Exact goal explicitly stated in a scanned source plan, independent of the selected goal.
        planGoalSourceDocumentIds:
          type: array
          items:
            type: string
        planGoalSourceReferences:
          type: array
          items:
            $ref: "#/components/schemas/SourceReference"
        source:
          type: string
          enum: [starter, parent_document, clinician_document, clinician_reviewed]
        sourceDocumentIds:
          type: array
          items:
            type: string
        sourceReferences:
          type: array
          items:
            $ref: "#/components/schemas/SourceReference"
        conflict:
          type: boolean
        conflictMessage:
          type: [string, "null"]
        whatMayBeHappening:
          type: string
        rightNow:
          type: array
          items:
            type: string
        avoid:
          type: array
          items:
            type: string
        prevention:
          type: array
          items:
            type: string
        replacementSkill:
          type: string
        reinforcementIdea:
          type: string
        seekHelp:
