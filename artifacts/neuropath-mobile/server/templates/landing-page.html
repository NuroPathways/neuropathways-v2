<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4f7eb5" />
    <title>APP_NAME_PLACEHOLDER</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 32px 20px;
        display: grid;
        place-items: center;
        font-family:
          Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1f2937;
        background: #f3f6fb;
      }

      main {
        width: min(100%, 480px);
        padding: 32px;
        text-align: center;
        background: #ffffff;
        border: 1px solid #dce4ee;
        border-radius: 20px;
        box-shadow: 0 18px 48px rgba(31, 41, 55, 0.1);
      }

      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border-radius: 20px;
        color: #ffffff;
        background: #4f7eb5;
        font-size: 34px;
        font-weight: 600;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.2;
      }

      p {
        margin: 10px 0 24px;
        color: #64748b;
      }

      #qr-code {
        width: 208px;
        height: 208px;
        margin: 0 auto 24px;
        padding: 12px;
        border: 1px solid #dce4ee;
        border-radius: 16px;
        background: #ffffff;
      }

      #qr-code canvas {
        width: 100%;
        height: 100%;
      }

      .primary {
        display: block;
        width: 100%;
        padding: 14px 18px;
        border-radius: 12px;
        color: #ffffff;
        background: #4f7eb5;
        font-weight: 700;
        text-decoration: none;
      }

      .stores {
        margin-top: 18px;
        display: flex;
        justify-content: center;
        gap: 18px;
        flex-wrap: wrap;
      }

      .stores a {
        color: #475569;
        font-size: 14px;
      }

      .source {
        margin-top: 22px;
        font-size: 12px;
      }

      @media (prefers-color-scheme: dark) {
        body {
          color: #f8fafc;
          background: #101827;
        }

        main {
          background: #182235;
          border-color: #2b3b54;
        }

        p,
        .stores a {
          color: #b5c1d1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">⌁</div>
      <h1>APP_NAME_PLACEHOLDER</h1>
      <p>Scan the code with your phone, or open the app directly in Expo Go.</p>

      <div id="qr-code" aria-label="Expo Go QR code"></div>

      <a class="primary" href="exps://EXPS_URL_PLACEHOLDER">
        Open in Expo Go
      </a>

      <div class="stores">
        <a href="https://apps.apple.com/app/id982107779">Get Expo Go for iOS</a>
        <a href="https://play.google.com/store/apps/details?id=host.exp.exponent">
          Get Expo Go for Android
        </a>
      </div>

      <p class="source">Served securely from BASE_URL_PLACEHOLDER</p>
    </main>

    <script src="https://unpkg.com/qr-code-styling@1.6.0/lib/qr-code-styling.js"></script>
    <script>
      const deepLink = "exps://EXPS_URL_PLACEHOLDER";
      const qrCode = new QRCodeStyling({
        width: 368,
        height: 368,
        data: deepLink,
        dotsOptions: { color: "#1f2937", type: "rounded" },
        cornersSquareOptions: { type: "extra-rounded" },
        cornersDotOptions: { type: "dot" },
        backgroundOptions: { color: "#ffffff" },
        qrOptions: { errorCorrectionLevel: "H" },
      });

      qrCode.append(document.getElementById("qr-code"));

      if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        window.location.href = deepLink;
      }
    </script>
  </body>
</html>
